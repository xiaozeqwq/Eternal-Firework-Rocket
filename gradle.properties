# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G -Djava.net.preferIPv4Stack=true
org.gradle.parallel=false

# Network resilience for flaky mirrors
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=500

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Mod properties
mod.id=eternal-firework-rocket
mod.name=Eternal Firework Rocket
mod.version=1.0.6
mod.group=xiaoze_qwq_.eternal_firework_rocket
archives_base_name=eternal-firework-rocket

# Dependencies (shared across all Minecraft versions)
deps.fabric_loader=0.18.4
