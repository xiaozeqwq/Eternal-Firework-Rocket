name: modrinth

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: prepare matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      mod_version: ${{ steps.version.outputs.mod_version }}
      changelog: ${{ steps.changelog.outputs.message }}
    steps:
      - name: download latest release jars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p jars
          gh release download --pattern "*.jar" --dir jars --clobber
          ls -la jars/

      - name: read mod version from tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --json tagName -q .tagName)
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "mod_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: get release body as changelog
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(gh release view --json body -q .body)
          echo "message<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: build matrix
        id: matrix
        run: |
          entries="[]"
          for jar in jars/*.jar; do
            name=$(basename "$jar")
            case "$name" in
              *-sources.jar|*-dev.jar|*-javadoc.jar) continue ;;
            esac
            mc=$(echo "$name" | sed -E 's/.*\+([0-9]+\.[0-9]+(\.[0-9]+)?)\.jar$/\1/')
            if [ "$mc" = "$name" ]; then
              echo "skip: cannot parse mc version from $name" >&2
              continue
            fi
            entry=$(jq -n --arg jar "$name" --arg mc "$mc" '{jar:$jar, mc:$mc}')
            entries=$(echo "$entries" | jq --argjson e "$entry" '. + [$e]')
          done
          matrix=$(echo "$entries" | jq -c '{include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "generated matrix: $matrix"

  publish:
    name: publish ${{ matrix.mc }}
    runs-on: ubuntu-24.04
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: download specific jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p jars
          gh release download --pattern "${{ matrix.jar }}" --dir jars --clobber
          ls -la jars/

      - name: publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: eternal-firework-rocket
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          version: ${{ needs.prepare.outputs.mod_version }}+${{ matrix.mc }}
          version-type: release
          loaders: fabric
          game-versions: ${{ matrix.mc }}
          files: jars/${{ matrix.jar }}
          changelog: ${{ needs.prepare.outputs.changelog }}
