name: test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.mc }} (${{ matrix.loader }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "26.1", loader: fabric, java: "25" }
          - { mc: "26.1.1", loader: fabric, java: "25" }
          - { mc: "26.1.2", loader: fabric, java: "25" }
          - { mc: "26.2", loader: fabric, java: "25" }
          - { mc: "26.3", loader: fabric, java: "25" }
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java || '21' }}
          distribution: 'temurin'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build Minecraft ${{ matrix.mc }} (${{ matrix.loader }})
        env:
          SC_VERSION: ${{ matrix.mc }}
          SC_DETACHED: "true"
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false
        run: ./gradlew :${{ matrix.mc }}-${{ matrix.loader }}:build --stacktrace --no-daemon

      # 把构建出来的 jar 重命名，加上 +<mc> 后缀
      - name: rename jars with mc suffix
        shell: bash
        run: |
          cd versions/${{ matrix.mc }}-${{ matrix.loader }}/build/libs/
          mc="${{ matrix.mc }}"
          for f in *.jar; do
            case "$f" in
              *-sources.jar|*-dev.jar|*-javadoc.jar) continue ;;
            esac
            base="${f%.jar}"
            if [[ "$base" == *"+$mc" ]]; then
              continue
            fi
            mv "$f" "${base}+$mc.jar"
          done
          ls -la

      - name: upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.mc }}-${{ matrix.loader }}
          path: versions/${{ matrix.mc }}-${{ matrix.loader }}/build/libs/
          if-no-files-found: error
          retention-days: 7
