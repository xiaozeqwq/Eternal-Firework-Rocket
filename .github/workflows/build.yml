name: build

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: ${{ matrix.mc }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mc:
          - "1.20.1"
          - "1.20.2"
          - "1.20.3"
          - "1.20.4"
          - "1.20.5"
          - "1.20.6"
          - "1.21"
          - "1.21.1"
          - "1.21.2"
          - "1.21.3"
          - "1.21.4"
          - "1.21.5"
          - "1.21.6"
          - "1.21.7"
          - "1.21.8"
          - "1.21.9"
          - "1.21.10"
          - "1.21.11"
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build Minecraft ${{ matrix.mc }}
        env:
          SC_VERSION: ${{ matrix.mc }}
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false
        run: ./gradlew :${{ matrix.mc }}:build --stacktrace --no-daemon

      # 把构建出来的 jar 重命名，加上 +<mc> 后缀，方便 modrinth.yml 解析
      - name: rename jars with mc suffix
        shell: bash
        run: |
          cd versions/${{ matrix.mc }}/build/libs/
          mc="${{ matrix.mc }}"
          for f in *.jar; do
            case "$f" in
              *-sources.jar|*-dev.jar|*-javadoc.jar) continue ;;
            esac
            base="${f%.jar}"
            if [[ "$base" == *"+$mc" ]]; then
              continue
            fi
            mv "$f" "${base}+$mc.jar"
          done
          ls -la

      - name: stage jar (temporary)
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.mc }}
          path: versions/${{ matrix.mc }}/build/libs/
          if-no-files-found: error
          retention-days: 1

  package:
    name: package
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: download all staged jars
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: all-jars
          merge-multiple: true
      - name: upload combined build artifact
        uses: actions/upload-artifact@v4
        with:
          name: eternal-firework-rocket-all
          path: all-jars/
          if-no-files-found: error

  release:
    name: release
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: download all staged jars
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: all-jars
          merge-multiple: true
      - name: read mod version
        id: mod_version
        run: |
          VERSION=$(grep -E '^mod\.version=' gradle.properties | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: get commit message
        id: commit
        run: |
          echo "message<<EOF" >> "$GITHUB_OUTPUT"
          git log -1 --pretty=%B >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: create tag and release with individual jars
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.mod_version.outputs.version }}
          name: v${{ steps.mod_version.outputs.version }}
          body: ${{ steps.commit.outputs.message }}
          files: |
            all-jars/**/*.jar
            !all-jars/**/*-sources.jar
            !all-jars/**/*-dev.jar
            !all-jars/**/*-javadoc.jar

  cleanup:
    name: cleanup
    runs-on: ubuntu-24.04
    needs: [package, release]
    if: always()
    steps:
      - name: remove per-version temporary artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            for (const artifact of artifacts) {
              if (artifact.name.startsWith('jar-')) {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id
                });
              }
            }
